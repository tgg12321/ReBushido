about = "The port's GTE and the C beside the assembly make of 116,000 made-up cases what the emulator's GTE and the assembly make of them"

# No disc: the GTE probe, a program of the tests' own (README.md, "The GTE
# probe"). It runs every case of tests/play/probe/cases.h on the
# emulator's coprocessor and compares the 64 registers it reads back with
# what src/port/gte.c made of the same case.
discs = ["gteprobe"]
common_state = false
cards = "none"
limit = 30000
seconds = 280

[state]
probe_done = "g_probe_done:u32"
probe_run = "g_probe_run:u32"
probe_failed = "g_probe_failed:u32"
# the first case that differed: its instruction word and its number
bad_command = "g_probe_bad:u32"
bad_vector = "g_probe_bad+4:u32"

# The first sixteen cases that differed, with the registers the emulator
# had (build/playtest/gte_model/gteprobe/bad.bin; tools/gte_probe.py
# prints them beside the model's).
[dump]
bad = "g_probe_bad:6784"
# The arena and the scratchpad as the first of the renderer's cases that
# differed left them (render.bin).
render = "g_probe_render_dump:46080"
# How many cases of each of the renderer's routines differed.
render_failed = "g_probe_render_failed:256"

[[checkpoint]]
name = "finished"
when = "probe_done == 1"
within = 29900
shot = false
expect = ["probe_run == 124000", "probe_failed == 0"]
