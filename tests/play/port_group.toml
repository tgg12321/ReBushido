about = "The native port against the emulator in a group battle: its first match won, the card of the scores between matches, and the second match begun."
discs = ["rebushido", "port"]
# The card between matches is drawn by a loader that fight_NextTeamMatch
# waits on inside a frame of the fight, after which the frame draws the
# HUD into the loading screen's ordering table (main.c,
# disp_DrawLoadingScreen): the window build crashed there. The presses and
# checkpoints are tools/port_match.py's group battle plans'.
