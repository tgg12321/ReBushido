[[checkpoint]]
name = "page"
when = "rb_page == RB_PAGE_UP"
within = 2000
shot = false

[[checkpoint]]
name = "movie"
when = "screen == SCREEN_MOVIE"
within = 1000
shot = false

[[checkpoint]]
name = "menu"
when = "screen == SCREEN_MENU_UPDATE && menu_page == MENU_PAGE_TOP && screen_frames >= 60"
within = 3000
shot = false

[[checkpoint]]
name = "fight"
when = "screen == SCREEN_FIGHT_UPDATE && mode == FIGHT_MODE_TEAM"
at_frame = true
within = 3000
expect = ["team_match == 0"]

[[checkpoint]]
name = "ippon"
when = "team_points_p1 == 1"
within = 6000
shot = false
expect = ["team_match == 0", "team_points_p2 == 0", "p2_defeated != 0"]

[[checkpoint]]
name = "card"
when = "loading_screen == 10 && team_match == 1"
within = 3000
shot = false
expect = ["mode == FIGHT_MODE_TEAM"]

[[checkpoint]]
name = "fight2"
when = "screen == SCREEN_FIGHT_UPDATE && team_match == 1"
at_frame = true
within = 3000
expect = ["mode == FIGHT_MODE_TEAM", "team_points_p1 == 0", "team_points_p2 == 0", "p1_defeated == 0",
          "p2_defeated == 0"]

[[checkpoint]]
name = "fight2_on"
after = 300
shot = false
expect = ["mode == FIGHT_MODE_TEAM", "team_match == 1"]
