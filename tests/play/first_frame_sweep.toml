about = "A pole arm's first frame sweeps its shaft from a stale place; with Bugfixes on, from where it is."
discs = ["quickboot-bugs", "quickboot-bugfixes"]
limit = 3000

# The hit tests' scratch (WeaponHitScratch, fighter.h), as the last sweep
# of a frame leaves it: the first fighter's shaft, its far end as it is
# and as it was a frame before. tests/rebushido/play_state.c holds the two
# addresses to the structure.
[state]
shaft_now_x = "0x1F8002C4:s32"
shaft_now_y = "0x1F8002C8:s32"
shaft_now_z = "0x1F8002CC:s32"
shaft_was_x = "0x1F8002DC:s32"
shaft_was_y = "0x1F8002E0:s32"
shaft_was_z = "0x1F8002E4:s32"

# The first fighter's first frame, the fight's first too. The original
# gives only the first of the weapon's three points a last place then
# (fighter_Update): the shaft's far end is swept from where the fight
# before left it, here nowhere, since this is the first fight since power
# on.
[[checkpoint]]
name = "first_frame"
runs = [1]
when = "p1_frames_alive == 1"
within = 2400
shot = false
expect = [
    "rb_bugfixes == 0",
    "p1_weapon == WEAPON_ID_NAGINATA",
    "shaft_was_x == 0 && shaft_was_y == 0 && shaft_was_z == 0",
    "shaft_now_x != 0 && shaft_now_y != 0 && shaft_now_z != 0",
]

# With the fix the sweep is from where the shaft is: no sweep at all.
[[checkpoint]]
name = "first_frame_fixed"
runs = [2]
when = "p1_frames_alive == 1"
within = 2400
shot = false
expect = [
    "rb_bugfixes == 1",
    "p1_weapon == WEAPON_ID_NAGINATA",
    "shaft_now_x != 0 && shaft_now_y != 0 && shaft_now_z != 0",
    "shaft_was_x == shaft_now_x && shaft_was_y == shaft_now_y && shaft_was_z == shaft_now_z",
]

# Either way the fight goes on.
[[checkpoint]]
name = "running"
after = 120
expect = ["screen == SCREEN_FIGHT_UPDATE", "p1_defeated == 0", "p2_defeated == 0"]
